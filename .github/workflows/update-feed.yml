name: Update Borealis feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: python make_feed.py

      - name: Commit feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if git diff --cached -U0 docs/feed.xml | grep -E '^[+-] ' | grep -vq 'lastBuildDate'; then
            git commit -m "Update Borealis feed"
            git push
          else
            echo "No new datasets"
          fi
